version: '3.9'

services:
  # -------------------------------------------------------
  # PostgreSQL 18 — host port 5433 (local 5432 pode estar em uso)
  # -------------------------------------------------------
  postgres:
    image: postgres:18-alpine
    container_name: walletz_med_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: walletz_med
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_dev_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # -------------------------------------------------------
  # Keycloak 24 (OIDC) — porta 8090
  # -------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    container_name: walletz_med_keycloak
    restart: unless-stopped
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: postgres
      KC_DB_PASSWORD: postgres_dev_password
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_dev_password
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
      KC_HTTP_ENABLED: "true"
      KC_LOG_LEVEL: INFO
      KC_HTTP_PORT: "8090"
    ports:
      - "8090:8090"
    volumes:
      - ./infra/docker/keycloak/realm-export.json:/opt/keycloak/data/import/realm-export.json
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 90s

  # -------------------------------------------------------
  # Mailpit — SMTP 1025, UI 8025
  # -------------------------------------------------------
  mailpit:
    image: axllent/mailpit:latest
    container_name: walletz_med_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "true"
      MP_SMTP_AUTH_ALLOW_INSECURE: "true"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8025/"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  postgres_data:
    driver: local
