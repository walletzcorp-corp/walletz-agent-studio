name: CI

on:
  push:
    branches: [main, master, staging, develop]
  pull_request:
    branches: [main, master, staging, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.1"

jobs:
  # ============================================================
  # Setup & Cache
  # ============================================================
  setup:
    name: Setup
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"

      - name: Get cache key
        id: cache-key
        run: echo "value=pnpm-${{ hashFiles('pnpm-lock.yaml') }}" >> $GITHUB_OUTPUT

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

  # ============================================================
  # Code Quality
  # ============================================================
  quality:
    name: Quality
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Format check
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

  # ============================================================
  # Tests (unit + integration)
  # ============================================================
  test:
    name: Tests
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: walletz
          POSTGRES_PASSWORD: walletz_test_password
          POSTGRES_DB: walletz_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_TEST_URL: postgresql://walletz:walletz_test_password@localhost:5432/walletz_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
      JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_only
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY_TEST }}

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Run migrations (test db)
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ env.DATABASE_TEST_URL }}

      - name: Run tests
        run: set -o pipefail; pnpm --filter @walletz/api test:cov 2>&1 | tee test.log

      - name: Surface failure details (Unit test failures)
        if: failure()
        run: |
          grep -E "●|✕|Expected|Received|Error|FAIL|rror:" test.log | head -n 40 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=Unit test failures::{}"

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: "**/coverage"

  # ============================================================
  # Security Scans
  # ============================================================
  security:
    name: Security
    needs: setup
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Dependency vulnerability scan
        run: pnpm audit --audit-level=high

      - name: Secret scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          extra_args: --only-verified

  # ============================================================
  # Build
  # ============================================================
  build:
    name: Build
    needs: [quality, test, security-e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Build all apps
        run: pnpm build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            apps/web/.next
            apps/api/dist
          retention-days: 3

  # ============================================================
  # Security E2E: tenant isolation (every route x role x tenant),
  # WhatsApp->calendar leak, agent tools, access control, LGPD.
  # Runs on EVERY push/PR; a single FAIL blocks the merge.
  # ============================================================
  security-e2e:
    name: Security E2E (tenant isolation)
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: walletz
          POSTGRES_PASSWORD: walletz_test_password
          POSTGRES_DB: walletz_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://walletz:walletz_test_password@localhost:5432/walletz_e2e
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Apply the full migration chain to the empty E2E database
        run: E2E_SKIP_CREATE=1 node scripts/e2e-db.cjs
        working-directory: apps/api

      - name: Security suites (tenant-isolation, whatsapp-calendar, tools, access-control)
        run: set -o pipefail; pnpm --filter @walletz/api test:security 2>&1 | tee security.log

      - name: Surface failure details (Security suite failures)
        if: failure()
        run: |
          grep -E "●|✕|Expected|Received|Error|FAIL|rror:" security.log | head -n 40 | sed -e 's/%/%25/g' -e ':a;N;$!ba;s/\n/%0A/g' | xargs -0 -I{} echo "::error title=Security suite failures::{}"

      - name: Upload isolation matrix
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tenant-isolation-matrix
          path: docs/qa/TENANT_ISOLATION_MATRIX.md

  # ============================================================
  # Migration Check
  # ============================================================
  migrations:
    name: Migrations Check
    needs: setup
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: walletz
          POSTGRES_PASSWORD: walletz_test_password
          POSTGRES_DB: walletz_migrations_check
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
      - run: pnpm install --frozen-lockfile

      - name: Migration dry run
        run: pnpm db:migrate:dry
        env:
          DATABASE_URL: postgresql://walletz:walletz_test_password@localhost:5432/walletz_migrations_check
