# Verificações de qualidade. Roda em PRs para master e é chamado pelo
# workflow Deploy (workflow_call) antes de gerar as imagens: se falhar,
# nada é publicado nem implantado.
name: CI

on:
  pull_request:
    branches: [master]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NODE_VERSION: "24"

jobs:
  # ── Bloqueantes ────────────────────────────────────────────────
  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # versão vem de "packageManager" no package.json
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  test:
    name: Testes unitários
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      JWT_ACCESS_SECRET: test_jwt_access_secret_for_ci_only
      JWT_REFRESH_SECRET: test_jwt_refresh_secret_for_ci_only
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  migrations:
    name: Migrations (banco limpo)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: walletz
          POSTGRES_PASSWORD: walletz_ci
          POSTGRES_DB: walletz_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://walletz:walletz_ci@localhost:5432/walletz_ci
      NODE_ENV: production # logger em JSON, como no servidor
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Mesmo caminho da produção: build + migrator do drizzle-orm.
      - run: pnpm --filter @walletz/api build
      - name: Aplica migrations
        working-directory: apps/api
        run: MIGRATIONS_DIR=src/database/migrations node dist/database/migrate.js
      - name: Reaplica (deve ser idempotente)
        working-directory: apps/api
        run: MIGRATIONS_DIR=src/database/migrations node dist/database/migrate.js

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          NEXT_PUBLIC_API_URL: https://agent-studio.walletzcorp.com/api

  # ── Informativos (não bloqueiam ainda; ver docs/release/STATUS.md) ──
  # Lint: projeto ainda sem eslint.config.js (ESLint 9). Format: ~250 arquivos
  # fora do Prettier. Isolamento: suíte não compila no jest (@nestjs/bullmq ESM).
  advisory:
    name: Lint / Format / Audit (informativo)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
        continue-on-error: true
      - name: Format
        run: pnpm format:check
        continue-on-error: true
      - name: Audit (high+)
        run: pnpm audit --audit-level=high
        continue-on-error: true
