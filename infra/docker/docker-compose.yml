services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: walletz-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: walletz
      POSTGRES_PASSWORD: walletz_dev_password
      POSTGRES_DB: walletz_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U walletz -d walletz_dev"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: walletz-redis
    restart: unless-stopped
    command: redis-server --requirepass walletz_redis_dev --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "walletz_redis_dev", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # MinIO descontinuou as imagens públicas (minio/minio no Docker Hub e
  # quay.io/minio/minio não são mais baixáveis). Usamos o build do MinIO da
  # Chainguard, que mantém a mesma CLI e variáveis. Variante -dev inclui shell.
  minio:
    image: cgr.dev/chainguard/minio:latest-dev
    container_name: walletz-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: walletz_minio
      MINIO_ROOT_PASSWORD: walletz_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest-dev
    container_name: walletz-minio-init
    depends_on:
      - minio
    restart: "no"
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 walletz_minio walletz_minio_dev_password; do
          echo 'aguardando MinIO...'; sleep 2
        done
        mc mb --ignore-existing local/walletz-uploads
        mc mb --ignore-existing local/walletz-knowledge
        mc anonymous set none local/walletz-uploads
        mc anonymous set none local/walletz-knowledge
        echo 'MinIO buckets initialized'

  redis-insight:
    image: redis/redisinsight:latest
    container_name: walletz-redis-insight
    restart: unless-stopped
    ports:
      - "5540:5540"
    profiles:
      - tools

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: walletz-network
